x-app-env: &app-env
  env_file:
    - .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-ainotula}
    DB_USERNAME: ${DB_USERNAME:-ainotula}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_HOST: redis
    REDIS_CLIENT: predis
    CACHE_DRIVER: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    STT_SERVICE_URL: http://whisper:5055/transcribe

services:
  app:
    build:
      context: .
      target: app
    <<: *app-env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    build:
      context: .
      target: webserver
    volumes:
      - storage_data:/var/www/html/storage:ro
    ports:
      - "8080:80"
    depends_on:
      - app

  queue:
    build:
      context: .
      target: app
    <<: *app-env
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      whisper:
        # not service_healthy: the queue worker also runs reminders/webhooks/mail,
        # so it shouldn't wait on a first-boot Whisper model download. A meeting
        # job that lands before Whisper is ready fails fast and retries ($backoff).
        condition: service_started

  scheduler:
    build:
      context: .
      target: app
    <<: *app-env
    command: php artisan schedule:work
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ainotula}
      MYSQL_USER: ${DB_USERNAME:-ainotula}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  whisper:
    build:
      context: ./docker/whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
    volumes:
      # Persist the downloaded model weights across rebuilds/restarts.
      - whisper_cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5055/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  mysql_data:
  redis_data:
  storage_data:
  whisper_cache:
